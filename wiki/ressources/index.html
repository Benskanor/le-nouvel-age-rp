<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ressources | Wiki Le Nouvel Âge</title>
<meta name="description" content="Catalogue des nouvelles ressources du mod Le Nouvel Âge RP.">
<link rel="stylesheet" href="../../assets/css/wiki.css">
</head>
<body data-wiki-page="resources">
<div id="wiki-site-header"></div>
<main>
<section class="wiki-hero">
  <div class="wiki-hero-inner">
    <div class="breadcrumbs"><a href="../">Wiki</a><span>›</span><span>Ressources</span></div>
    <p class="overline">Catalogue du mod</p><h1>Ressources</h1>
    <p class="lead">Pêche, agriculture, récolte et transformations : consultez les ressources ajoutées par Le Nouvel Âge et ouvrez leur fiche détaillée.</p>
  </div>
</section>
<div class="wiki-shell">
  <section class="wiki-section">
    <div class="wiki-toolbar">
      <input id="resourceSearch" type="search" placeholder="Rechercher une ressource…">
      <select id="resourceCategory"><option>Toutes</option></select>
      <select id="resourceRealm"><option>Tous</option></select>
    </div>
    <div class="directory-count"><strong id="resourceCount">—</strong> fiche(s) affichée(s)</div>
    <div id="resourceDirectory" class="resource-grid wiki-loading">Chargement…</div>
  </section>
</div>
</main>
<div id="wiki-site-footer"></div>
<script src="../../assets/js/wiki-shell.js" defer></script><script src="../../assets/js/wiki.js" defer></script>
</body></html>
